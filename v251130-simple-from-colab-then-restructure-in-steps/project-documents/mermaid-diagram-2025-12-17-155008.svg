62.5px 108px" class="task crit0"></rect><rect id="task10" rx="3" ry="3" x="76" y="266" width="986" height="20" transform-origin="569px 276px" class="task active2"></rect><rect id="task15" rx="3" ry="3" x="76" y="386" width="1973" height="20" transform-origin="1062.5px 396px" class="task done0"></rect><rect id="task4" rx="3" ry="3" x="76" y="122" width="1973" height="20" transform-origin="1062.5px 132px" class="task crit0"></rect><rect id="task11" rx="3" ry="3" x="76" y="290" width="1315" height="20" transform-origin="733.5px 300px" class="task active2"></rect><rect id="task16" rx="3" ry="3" x="76" y="410" width="1973" height="20" transform-origin="1062.5px 420px" class="task done1"></rect><rect id="task5" rx="3" ry="3" x="76" y="146" width="1973" height="20" transform-origin="1062.5px 156px" class="task crit0"></rect><rect id="task12" rx="3" ry="3" x="76" y="314" width="1644" height="20" transform-origin="898px 324px" class="task active2"></rect><rect id="task17" rx="3" ry="3" x="76" y="434" width="1973" height="20" transform-origin="1062.5px 444px" class="task done2"></rect><rect id="task6" rx="3" ry="3" x="77" y="170" width="1972" height="20" transform-origin="1063px 180px" class="task crit0"></rect><rect id="task13" rx="3" ry="3" x="77" y="338" width="1972" height="20" transform-origin="1063px 348px" class="task active2"></rect><rect id="task18" rx="3" ry="3" x="77" y="458" width="1972" height="20" transform-origin="1063px 468px" class="task done3"></rect><text id="task1-text" font-size="11" x="1062" y="63.5" class="taskText taskText0 activeText0 width-830.1017456054688">Defines project configuration, Sets up path definitions, Defines PROJECT_ROOT OUTPUT_DIR, Implements directory creation logic, Serves as base for all file operations </text><text id="task7-text" font-size="11" x="1062" y="207.5" class="taskText taskText1 activeText1 width-795.4110717773438">Provides utility functions, Helps with file system operations, Implements clean_outputs() zip_all_outputs(), Uses shutil zipfile libraries, Manages output artifacts </text><text id="task8-text" font-size="11" x="409" y="231.5" class="taskTextOutsideRight taskTextOutside2 activeText2 width-512.5895385742188">Acts as entry point, Tests infrastructure setup, Runs test_infrastructure(), Verifies paths writes test file </text><text id="task2-text" font-size="11" x="1062" y="87.5" class="taskText taskText0  critText0 width-588.55078125">Configures data settings, Adds flag ENABLE_DATA_PROCESSING, Sets Pandas display options, Defines data file constants </text><text id="task9-text" font-size="11" x="404" y="255.5" class="taskText taskText2 activeText2 width-566.129150390625">Tests Data Module, Integrates Data Module, Runs test_data_module(), Executes ETL pipeline, Validates data shape </text><text id="task14-text" font-size="11" x="1062" y="375.5" class="taskText taskText3  doneText3 width-714.6828002929688">Implements Data Module, Performs ETL operations, Runs download() load() preprocess(), Creates Pandas DataFrame, Cleans columns casts types </text><text id="task3-text" font-size="11" x="1062.5" y="111.5" class="taskText taskText0  critText0 width-577.4863891601562">Configures analysis settings, Adds flags ENABLE_EXPLORATORY_ANALYSIS ENABLE_TIME_SERIES, Controls analysis flow </text><text id="task10-text" font-size="11" x="569" y="279.5" class="taskText taskText2 activeText2 width-495.41162109375">Tests Analysis Module, Integrates Analysis Module, Runs test_analysis_module(), Generates statistics </text><text id="task15-text" font-size="11" x="1062.5" y="399.5" class="taskText taskText0  doneText0 width-693.1113891601562">Implements Analysis Module, Processes statistics, Runs aggregate_time_series(), Performs GroupBy operations, Calculates YoY Growth Totals </text><text id="task4-text" font-size="11" x="1062.5" y="135.5" class="taskText taskText0  critText0 width-724.5631713867188">Configures visualization settings, Adds flags ENABLE_STATIC_PLOTS ENABLE_DASHBOARDS, Sets up plotting libraries, Configures Matplotlib Seaborn </text><text id="task11-text" font-size="11" x="733.5" y="303.5" class="taskText taskText2 activeText2 width-506.6127624511719">Tests Visualization Module, Integrates Visuals, Runs test_visualization_module(), Triggers plot creation </text><text id="task16-text" font-size="11" x="1062.5" y="423.5" class="taskText taskText1  doneText1 width-712.0890502929688">Implements Visualization Module, Generates charts, Creates static interactive plots, Uses Matplotlib/Seaborn Plotly, Saves png html dashboards </text><text id="task5-text" font-size="11" x="1062.5" y="159.5" class="taskText taskText0  critText0 width-428.8172912597656">Configures reporting settings, Adds ENABLE_REPORTING flag, Activates text generation </text><text id="task12-text" font-size="11" x="898" y="327.5" class="taskText taskText2 activeText2 width-503.4236755371094">Tests Reporting Module, Integrates Reporting, Runs test_reporting_module(), Generates text artifacts </text><text id="task17-text" font-size="11" x="1062.5" y="447.5" class="taskText taskText2  doneText2 width-757.8905029296875">Implements Reporting Module, Generates narrative, Runs generate_monthly_report(), Uses string formatting templates, Produces executive summary txt </text><text id="task6-text" font-size="11" x="1063" y="183.5" class="taskText taskText0  critText0 width-559.0797729492188">Finalizes configuration, Adds ENABLE_AGGREGATOR flag, Enables final packaging, Activates complete feature set </text><text id="task13-text" font-size="11" x="1063" y="351.5" class="taskText taskText2 activeText2 width-505.7219543457031">Runs full pipeline, Executes end-to-end, Runs test_full_pipeline(), Orchestrates Steps 2-6 sequentially </text><text id="task18-text" font-size="11" x="1063" y="471.5" class="taskText taskText3  doneText3 width-656.75048828125">Implements Aggregator Module, Consolidates outputs, Runs create_aggregator_html(), Generates HTML Index, Links all artifacts Zips </text></g><g>